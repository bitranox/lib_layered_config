{% set name = "lib_layered_config" %}
{% set version = "0.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

{% if environ.get('CONDA_USE_LOCAL', '0') == '1' %}
source:
  # Build from local checkout (CI/dev). Set CONDA_USE_LOCAL=1.
  path: ../../..
{% else %}
source:
  # For released tags; replace sha256 before submitting to conda-forge
  url: https://github.com/bitranox/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 68cf43bdd55e2be22ca0bbd03492516446e4d1ebc9bfaa11a363e8187410c629
{% endif %}

build:
  noarch: python
  # Use conda-provided build backend and avoid network isolation issues
  script: "{{ PYTHON }} -m pip install --no-deps --no-build-isolation -vv ."

requirements:
  host:
    - python >=3.13
    - pip
    - hatchling >=1.25
  run:
    - python >=3.13
    - lib_cli_exit_tools >=1.6.0
    - rich-click >=1.9.2

test:
  commands:
    - python -c "import lib_layered_config as m; print(m.__all__)"
    - lib_layered_config --version

about:
  home: https://github.com/bitranox/lib_layered_config
  license: MIT
  license_family: MIT
  summary: "Layered configuration loader for Python applications"

extra:
  recipe-maintainers:
    - bitranox
